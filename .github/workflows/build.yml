name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk IlhaDinamica.apk
          else
            echo "::warning::Sem o segredo KEYSTORE_PASSWORD: gerando APK de teste (assinatura temporária)"
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk IlhaDinamica.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: IlhaDinamica
          path: IlhaDinamica.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ilha Dinâmica v0.1.${{ github.run_number }}
          body: Baixe o arquivo IlhaDinamica.apk abaixo e instale no celular.
          files: IlhaDinamica.apk
